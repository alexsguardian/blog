name: Content Lint

on:
  pull_request:
    paths:
      - 'src/data/posts/**'
      - 'scripts/lint-content.py'
      - 'scripts/check-links.py'
      - '.github/workflows/content-lint.yml'

permissions:
  contents: read

jobs:
  static-checks:
    name: Placeholder / FTC / alt-text checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run content lint
        run: python3 scripts/lint-content.py

  link-check:
    name: Broken internal link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check internal links
        run: python3 scripts/check-links.py
